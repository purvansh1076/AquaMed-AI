# Alembic configuration for AquaMediAI
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the alembic/ scripts directory
script_location = alembic

# Template used for new migration files
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# SQLAlchemy database URL
# Overridden at runtime by env.py which reads from Settings
sqlalchemy.url = postgresql+psycopg2://aquamedi:aquamedi_secret@localhost:5432/aquamedi_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
